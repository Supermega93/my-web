<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 860" width="100%" height="100%">
  <defs>
    <!-- Background Shadow -->
    <filter id="bookShadow" x="-20%" y="-15%" width="140%" height="140%">
      <feDropShadow dx="18" dy="24" stdDeviation="20" flood-color="#0f172a" flood-opacity="0.32" />
      <feDropShadow dx="4" dy="6" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.18" />
    </filter>

    <!-- Page Depth Effect -->
    <linearGradient id="pageStackGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stopColor="#D8D8DC" />
      <stop offset="40%" stopColor="#F4F4F6" />
      <stop offset="70%" stopColor="#E2E2E6" />
      <stop offset="100%" stopColor="#B4B4BA" />
    </linearGradient>

    <!-- Spine Depth Gradient -->
    <linearGradient id="spine3D" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stopColor="#E2DFD8" />
      <stop offset="25%" stopColor="#FFFFFF" />
      <stop offset="75%" stopColor="#E5E2DA" />
      <stop offset="100%" stopColor="#C4C0B6" />
    </linearGradient>

    <!-- Cover Linen Paper Gradient -->
    <linearGradient id="coverPaper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stopColor="#FCFCFB" />
      <stop offset="45%" stopColor="#F9F8F5" />
      <stop offset="100%" stopColor="#F3EFE8" />
    </linearGradient>

    <!-- Gold Foil Gradients -->
    <linearGradient id="goldSheen" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stopColor="#967018" />
      <stop offset="20%" stopColor="#C59B27" />
      <stop offset="50%" stopColor="#E7C65A" />
      <stop offset="80%" stopColor="#C59B27" />
      <stop offset="100%" stopColor="#876214" />
    </linearGradient>

    <linearGradient id="goldLine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stopColor="#B8860B" stopOpacity="0.2" />
      <stop offset="15%" stopColor="#C59B27" />
      <stop offset="50%" stopColor="#E5C158" />
      <stop offset="85%" stopColor="#C59B27" />
      <stop offset="100%" stopColor="#B8860B" stopOpacity="0.2" />
    </linearGradient>

    <!-- Dark Navy Typography Gradient -->
    <linearGradient id="navyText" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stopColor="#0F172A" />
      <stop offset="100%" stopColor="#1E293B" />
    </linearGradient>

    <!-- Subtle Architectural Crest Gradient -->
    <radialGradient id="crestGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stopColor="#E5C158" stopOpacity="0.16" />
      <stop offset="60%" stopColor="#C59B27" stopOpacity="0.05" />
      <stop offset="100%" stopColor="#B8860B" stopOpacity="0" />
    </radialGradient>
  </defs>

  <g transform="translate(40, 30)">
    <!-- 3D Page Edges (Right side and bottom) -->
    <polygon points="518,22 538,32 538,772 518,762" fill="url(#pageStackGrad)" />
    <polygon points="518,762 538,772 58,772 40,762" fill="#B8B8BE" />

    <!-- Soft Under Shadow & Main Book Body -->
    <rect x="40" y="20" width="478" height="742" rx="4" fill="url(#coverPaper)" filter="url(#bookShadow)" stroke="#D5D0C5" stroke-width="1.5" />

    <!-- Spine Hinge Indentation -->
    <rect x="40" y="20" width="22" height="742" rx="2" fill="url(#spine3D)" />
    <line x1="62" y1="20" x2="62" y2="762" stroke="#BEB9AD" stroke-width="1.5" />
    <line x1="63.5" y1="20" x2="63.5" y2="762" stroke="#FFFFFF" stroke-width="1.2" opacity="0.8" />

    <!-- Delicate Double Outer Academic Frame -->
    <rect x="80" y="44" width="418" height="694" fill="none" stroke="#DCD7CB" stroke-width="1.2" />
    <rect x="84" y="48" width="410" height="686" fill="none" stroke="#C59B27" stroke-width="0.8" stroke-dasharray="8, 4" opacity="0.4" />

    <!-- Top Running Header -->
    <text x="475" y="74" text-anchor="end" font-family="'Plus Jakarta Sans', -apple-system, sans-serif" font-size="9" font-weight="700" fill="#64748B" letter-spacing="2.4">THE SCHOOL OF AI TRADING ARCHITECTURE</text>
    <line x1="84" y1="84" x2="494" y2="84" stroke="#E2DFD6" stroke-width="1" />

    <!-- ============================================== -->
    <!-- MAIN TITLE BLOCK (Matching Page 1 of the PDF) -->
    <!-- ============================================== -->
    <g transform="translate(289, 178)">
      <!-- Eyebrow Title -->
      <text x="0" y="0" text-anchor="middle" font-family="'Cinzel', 'Georgia', serif" font-size="15" font-weight="700" fill="url(#goldSheen)" letter-spacing="7">T H E   S C H O O L   O F</text>

      <!-- Primary Title -->
      <text x="0" y="44" text-anchor="middle" font-family="'Cinzel', 'Playfair Display', 'Georgia', serif" font-size="34" font-weight="900" fill="url(#navyText)" letter-spacing="1.5">AI TRADING</text>
      <text x="0" y="86" text-anchor="middle" font-family="'Cinzel', 'Playfair Display', 'Georgia', serif" font-size="34" font-weight="900" fill="url(#navyText)" letter-spacing="1.5">ARCHITECTURE</text>

      <!-- Upper Gold Rule -->
      <line x1="-190" y1="122" x2="190" y2="122" stroke="url(#goldLine)" stroke-width="2.5" />

      <!-- Subtitle -->
      <text x="0" y="148" text-anchor="middle" font-family="'Plus Jakarta Sans', -apple-system, sans-serif" font-size="10" font-weight="700" fill="#334155" letter-spacing="1.8">A COMPLETE, ZERO-CODE COURSE FOR BUILDING PROFESSIONAL</text>
      <text x="0" y="168" text-anchor="middle" font-family="'Plus Jakarta Sans', -apple-system, sans-serif" font-size="10.5" font-weight="800" fill="#0F172A" letter-spacing="2.2">METATRADER 5 ROBOTS WITH AI</text>

      <!-- Lower Gold Rule -->
      <line x1="-190" y1="194" x2="190" y2="194" stroke="url(#goldLine)" stroke-width="2.5" />
    </g>

    <!-- ============================================== -->
    <!-- ARCHITECTURAL ACADEMIC CREST EMBLEM -->
    <!-- ============================================== -->
    <g transform="translate(289, 442)">
      <circle cx="0" cy="0" r="48" fill="url(#crestGlow)" />
      <circle cx="0" cy="0" r="42" fill="none" stroke="#C59B27" stroke-width="1.2" stroke-dasharray="4, 2" />
      <circle cx="0" cy="0" r="36" fill="none" stroke="#0F172A" stroke-width="1.5" />

      <!-- Candlestick + Compass Geometric Emblem -->
      <!-- Center Bullish Candlestick -->
      <line x1="0" y1="-26" x2="0" y2="26" stroke="#C59B27" stroke-width="1.8" />
      <rect x="-6" y="-14" width="12" height="28" fill="#0F172A" rx="1.5" stroke="#C59B27" stroke-width="1" />
      <!-- Flanking Candlesticks -->
      <line x1="-14" y1="-18" x2="-14" y2="16" stroke="#94A3B8" stroke-width="1.2" />
      <rect x="-18" y="-8" width="8" height="18" fill="#FFFFFF" stroke="#0F172A" stroke-width="1" rx="1" />
      <line x1="14" y1="-20" x2="14" y2="22" stroke="#94A3B8" stroke-width="1.2" />
      <rect x="10" y="-12" width="8" height="22" fill="#C59B27" rx="1" />

      <!-- Small Academic Laurel Accents -->
      <path d="M-28,16 Q-36,2 -24,-14" fill="none" stroke="#C59B27" stroke-width="1.2" stroke-linecap="round" />
      <path d="M28,16 Q36,2 24,-14" fill="none" stroke="#C59B27" stroke-width="1.2" stroke-linecap="round" />
    </g>

    <!-- ============================================== -->
    <!-- COURSE SCOPE (From Page 1 of the PDF) -->
    <!-- ============================================== -->
    <g transform="translate(289, 532)">
      <!-- Gold Italic Callout -->
      <text x="0" y="0" text-anchor="middle" font-family="'Playfair Display', 'Georgia', serif" font-size="14.5" font-style="italic" font-weight="700" fill="url(#goldSheen)" letter-spacing="1.2">FROM PRESCHOOL TO GRADUATION</text>

      <!-- Exact Descriptor from PDF -->
      <text x="0" y="26" text-anchor="middle" font-family="'Plus Jakarta Sans', -apple-system, sans-serif" font-size="10.5" font-weight="600" fill="#475569" letter-spacing="1">Levels 1 – 8 · Prompt Library · Capstone Projects · Hands-On Labs</text>
    </g>

    <!-- ============================================== -->
    <!-- AUTHOR SECTION (Matching Page 1 of the PDF) -->
    <!-- ============================================== -->
    <g transform="translate(289, 642)">
      <text x="0" y="0" text-anchor="middle" font-family="'Cinzel', 'Playfair Display', 'Georgia', serif" font-size="19" font-weight="900" fill="url(#navyText)" letter-spacing="3.5">M. DINGA</text>
      <text x="0" y="22" text-anchor="middle" font-family="'Plus Jakarta Sans', -apple-system, sans-serif" font-size="10" font-weight="600" fill="#64748B" letter-spacing="2">Strategy Architect · Trader · Author</text>
    </g>

    <!-- Bottom Page Citation -->
    <text x="289" y="718" text-anchor="middle" font-family="'Plus Jakarta Sans', -apple-system, sans-serif" font-size="8" font-weight="500" fill="#94A3B8" letter-spacing="1">71-PAGE COMPLETE ACCREDITED MASTER CURRICULUM</text>
  </g>
</svg>
