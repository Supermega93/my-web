<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="deskGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stopColor="#0d1117" />
      <stop offset="60%" stopColor="#1a1d24" />
      <stop offset="100%" stopColor="#2b1d16" />
    </linearGradient>
    <radialGradient id="monitorGlow" cx="20%" cy="30%" r="60%">
      <stop offset="0%" stopColor="#0284c7" stopOpacity="0.25" />
      <stop offset="50%" stopColor="#0369a1" stopOpacity="0.08" />
      <stop offset="100%" stopColor="#000000" stopOpacity="0" />
    </radialGradient>

    <!-- Gold Foil Typography Gradients -->
    <linearGradient id="goldText" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stopColor="#FFEA9F" />
      <stop offset="30%" stopColor="#D4A136" />
      <stop offset="70%" stopColor="#A6731B" />
      <stop offset="100%" stopColor="#6C4505" />
    </linearGradient>
    <linearGradient id="goldFoil" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stopColor="#F9E29D" />
      <stop offset="35%" stopColor="#D9A84E" />
      <stop offset="65%" stopColor="#F3D389" />
      <stop offset="100%" stopColor="#9E6B18" />
    </linearGradient>

    <!-- Paper & Cover Gradients -->
    <linearGradient id="coverPaper" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stopColor="#ECECEE" />
      <stop offset="5%" stopColor="#FBFBFB" />
      <stop offset="95%" stopColor="#F7F7F7" />
      <stop offset="100%" stopColor="#EDEDEF" />
    </linearGradient>
    <linearGradient id="spineGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stopColor="#D1D1D4" />
      <stop offset="40%" stopColor="#EEEEF0" />
      <stop offset="85%" stopColor="#CACACD" />
      <stop offset="100%" stopColor="#87878B" />
    </linearGradient>

    <!-- Holographic AI Portal Gradients -->
    <radialGradient id="portalCore" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stopColor="#FFFFFF" />
      <stop offset="25%" stopColor="#67E8F9" />
      <stop offset="60%" stopColor="#0284C7" />
      <stop offset="85%" stopColor="#0F172A" />
      <stop offset="100%" stopColor="#050811" stopOpacity="0" />
    </radialGradient>
    <linearGradient id="cyanBeam" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stopColor="#38BDF8" stopOpacity="0.8" />
      <stop offset="100%" stopColor="#0284C7" stopOpacity="0.1" />
    </linearGradient>

    <!-- Filters -->
    <filter id="bookShadow" x="-15%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="16" dy="24" stdDeviation="18" flood-color="#000000" flood-opacity="0.65" />
    </filter>
    <filter id="glowEffect" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="emboss" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="1" dy="1.5" stdDeviation="0.8" flood-color="#000000" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Background Environment (Trader Desk & Monitor Glow) -->
  <rect width="600" height="800" fill="url(#deskGrad)" />
  <rect width="600" height="800" fill="url(#monitorGlow)" />

  <!-- Background Candlestick Monitor Simulation (Soft Bokeh) -->
  <g opacity="0.18">
    <line x1="30" y1="120" x2="30" y2="350" stroke="#0ea5e9" stroke-width="2" />
    <rect x="22" y="180" width="16" height="90" fill="#0ea5e9" rx="2" />
    <line x1="60" y1="80" x2="60" y2="280" stroke="#10b981" stroke-width="2" />
    <rect x="52" y="110" width="16" height="120" fill="#10b981" rx="2" />
    <line x1="90" y1="160" x2="90" y2="380" stroke="#ef4444" stroke-width="2" />
    <rect x="82" y="200" width="16" height="110" fill="#ef4444" rx="2" />
  </g>

  <!-- Ground Shadow for Book -->
  <ellipse cx="320" cy="740" rx="240" ry="26" fill="#000000" opacity="0.75" />

  <!-- 3D BOOK CONTAINER -->
  <g filter="url(#bookShadow)">
    <!-- Book Spine (Left 3D perspective) -->
    <path d="M 85 75 L 125 65 L 125 715 L 85 730 Z" fill="url(#spineGrad)" />
    <!-- Spine Embossed Text -->
    <g transform="translate(108, 380) rotate(-90)">
      <text x="0" y="0" text-anchor="middle" font-family="'Cinzel', 'Trajan Pro', 'Georgia', serif" font-size="13" font-weight="bold" fill="#5A421D" letter-spacing="4">
        BUILD TRADING BOTS WITH AI &amp; MQL5
      </text>
      <text x="210" y="0" text-anchor="middle" font-family="'Cinzel', serif" font-size="11" font-weight="bold" fill="#755627" letter-spacing="3">
        M DINGA
      </text>
    </g>

    <!-- Book Front Cover -->
    <rect x="125" y="65" width="410" height="650" rx="6" fill="url(#coverPaper)" />

    <!-- Spine fold line & lighting highlight -->
    <line x1="126" y1="65" x2="126" y2="715" stroke="#FFFFFF" stroke-width="2" opacity="0.9" />
    <line x1="130" y1="65" x2="130" y2="715" stroke="#CFCFD3" stroke-width="1" />
    <line x1="534" y1="66" x2="534" y2="714" stroke="#E2E2E6" stroke-width="1.5" />
    <line x1="125" y1="714" x2="535" y2="714" stroke="#D1D1D6" stroke-width="1.5" />

    <!-- ================= COVER CONTENTS ================= -->

    <!-- TOP TITLE: GOLD METALLIC EMBOSSED -->
    <g filter="url(#emboss)" text-anchor="middle">
      <text x="330" y="130" font-family="'Cinzel', 'Playfair Display', 'Times New Roman', serif" font-size="44" font-weight="900" fill="url(#goldText)" letter-spacing="1">
        Build
      </text>
      <text x="330" y="185" font-family="'Cinzel', 'Playfair Display', 'Times New Roman', serif" font-size="48" font-weight="900" fill="url(#goldText)" letter-spacing="0.5">
        Trading Bots
      </text>
      <text x="330" y="240" font-family="'Cinzel', 'Playfair Display', 'Times New Roman', serif" font-size="42" font-weight="900" fill="url(#goldText)" letter-spacing="0.5">
        with AI &amp; MQL5
      </text>
    </g>

    <!-- SUBTITLE -->
    <text x="330" y="274" text-anchor="middle" font-family="'Inter', 'Helvetica Neue', sans-serif" font-size="11.5" font-weight="600" fill="#475569" letter-spacing="0.2">
      Learn to Create Professional Expert Advisors &amp;
    </text>
    <text x="330" y="292" text-anchor="middle" font-family="'Inter', 'Helvetica Neue', sans-serif" font-size="11.5" font-weight="600" fill="#475569" letter-spacing="0.2">
      Custom Indicators — No Coding Experience Required.
    </text>

    <!-- ================= CENTRAL GRAPHIC: AI HOLOGRAPHIC PORTAL ================= -->
    <g transform="translate(330, 440)">
      <!-- Outer Glow Burst -->
      <circle cx="0" cy="0" r="115" fill="url(#portalCore)" opacity="0.9" />

      <!-- Interconnected Neural Network Rings -->
      <circle cx="0" cy="0" r="95" fill="none" stroke="#38BDF8" stroke-width="1.5" stroke-dasharray="4 3" opacity="0.6" />
      <circle cx="0" cy="0" r="75" fill="none" stroke="#0284C7" stroke-width="2" opacity="0.8" />
      <circle cx="0" cy="0" r="60" fill="#030712" stroke="#67E8F9" stroke-width="3" filter="url(#glowEffect)" />

      <!-- Glowing Center AI Letters -->
      <text x="0" y="15" text-anchor="middle" font-family="'Montserrat', 'Arial Black', sans-serif" font-size="40" font-weight="900" fill="#FFFFFF" filter="url(#glowEffect)">
        AI
      </text>

      <!-- Radiating Quantum Circuit Sparks -->
      <g stroke="#38BDF8" stroke-width="1" opacity="0.75">
        <line x1="-55" y1="-55" x2="-85" y2="-85" />
        <circle cx="-85" cy="-85" r="3" fill="#67E8F9" />
        <line x1="55" y1="-55" x2="85" y2="-85" />
        <circle cx="85" cy="-85" r="3" fill="#67E8F9" />
        <line x1="-55" y1="55" x2="-85" y2="85" />
        <circle cx="-85" cy="85" r="3" fill="#67E8F9" />
        <line x1="55" y1="55" x2="85" y2="85" />
        <circle cx="85" cy="85" r="3" fill="#67E8F9" />
        <line x1="0" y1="-75" x2="0" y2="-100" />
        <circle cx="0" cy="-100" r="3" fill="#FACC15" />
        <line x1="0" y1="75" x2="0" y2="100" />
        <circle cx="0" cy="100" r="3" fill="#FACC15" />
      </g>

      <!-- LEFT FLOATING HUD: MQL5 CODE TERMINAL -->
      <g transform="translate(-165, -75)">
        <rect width="115" height="150" rx="8" fill="#0A0F1D" fill-opacity="0.9" stroke="#0284C7" stroke-width="1.5" filter="url(#emboss)" />
        <rect width="115" height="22" rx="8" fill="#0F172A" />
        <text x="12" y="15" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="bold" fill="#38BDF8">
          MQL5 CODE
        </text>
        <!-- Mini code text simulation -->
        <g font-family="'JetBrains Mono', monospace" font-size="6.5" fill="#94A3B8">
          <text x="8" y="36" fill="#64748B">//--- Init</text>
          <text x="8" y="48" fill="#38BDF8">int OnInit() {</text>
          <text x="14" y="60" fill="#F1F5F9">AutoRisk = 1.0;</text>
          <text x="14" y="72" fill="#34D399">return(0);</text>
          <text x="8" y="84" fill="#38BDF8">}</text>
          <text x="8" y="98" fill="#64748B">//--- Tick</text>
          <text x="8" y="110" fill="#38BDF8">void OnTick() {</text>
          <text x="14" y="122" fill="#FBBF24">if(Sweep) {</text>
          <text x="20" y="134" fill="#38BDF8">OrderSend();</text>
          <text x="8" y="144" fill="#38BDF8">}}</text>
        </g>
      </g>

      <!-- RIGHT FLOATING HUD: CHARTS & EXPERT ADVISOR DASHBOARD -->
      <g transform="translate(55, -75)">
        <!-- Candlestick chart mini box -->
        <rect width="115" height="70" rx="8" fill="#0A0F1D" fill-opacity="0.9" stroke="#0284C7" stroke-width="1.5" filter="url(#emboss)" />
        <!-- Candlesticks -->
        <g transform="translate(10, 10)">
          <line x1="12" y1="8" x2="12" y2="45" stroke="#10B981" stroke-width="1" />
          <rect x="8" y="18" width="8" height="20" fill="#10B981" rx="1" />
          <line x1="28" y1="5" x2="28" y2="48" stroke="#EF4444" stroke-width="1" />
          <rect x="24" y="12" width="8" height="24" fill="#EF4444" rx="1" />
          <line x1="44" y1="12" x2="44" y2="40" stroke="#10B981" stroke-width="1" />
          <rect x="40" y="16" width="8" height="15" fill="#10B981" rx="1" />
          <line x1="60" y1="2" x2="60" y2="46" stroke="#10B981" stroke-width="1" />
          <rect x="56" y="8" width="8" height="26" fill="#10B981" rx="1" />
          <line x1="76" y1="15" x2="76" y2="42" stroke="#EAB308" stroke-width="1" />
          <rect x="72" y="20" width="8" height="12" fill="#EAB308" rx="1" />
        </g>

        <!-- Lower EA Status Window -->
        <g transform="translate(0, 78)">
          <rect width="115" height="72" rx="8" fill="#0A0F1D" fill-opacity="0.9" stroke="#38BDF8" stroke-width="1.5" filter="url(#emboss)" />
          <text x="10" y="16" font-family="'Inter', sans-serif" font-size="8.5" font-weight="bold" fill="#F8FAFC">
            Expert Advisor
          </text>
          <text x="10" y="28" font-family="'JetBrains Mono', monospace" font-size="7" fill="#10B981">
            ● Status: Active
          </text>
          <!-- Sparkline -->
          <path d="M 10 44 Q 30 42, 45 36 T 75 28 T 105 20" fill="none" stroke="#38BDF8" stroke-width="1.5" />
          <!-- Auto Trading Pill -->
          <rect x="10" y="50" width="95" height="16" rx="4" fill="#0369A1" />
          <text x="57" y="61" text-anchor="middle" font-family="'Inter', sans-serif" font-size="7.5" font-weight="bold" fill="#FFFFFF">
            Auto Trading ✓
          </text>
        </g>
      </g>
    </g>

    <!-- ================= BOTTOM PROCESS ICONS ================= -->
    <!-- TRADING IDEA > AI STRATEGY > AUTOMATED CODE > TRADING BOT -->
    <g transform="translate(155, 595)">
      <!-- Item 1: Trading Idea -->
      <g transform="translate(0, 0)">
        <circle cx="20" cy="12" r="10" fill="none" stroke="#B8860B" stroke-width="1.5" />
        <path d="M 16 12 Q 20 6, 24 12" stroke="#B8860B" stroke-width="1.5" fill="none" />
        <text x="20" y="32" text-anchor="middle" font-family="'Inter', sans-serif" font-size="7.5" font-weight="bold" fill="#475569" letter-spacing="0.5">
          TRADING IDEA
        </text>
      </g>

      <!-- Arrow 1 -->
      <text x="65" y="16" font-family="'Inter', sans-serif" font-size="12" fill="#B8860B" font-weight="bold">&gt;</text>

      <!-- Item 2: AI Strategy -->
      <g transform="translate(90, 0)">
        <circle cx="20" cy="12" r="10" fill="none" stroke="#B8860B" stroke-width="1.5" />
        <path d="M 15 12 L 25 12 M 20 7 L 20 17" stroke="#B8860B" stroke-width="1.5" />
        <text x="20" y="32" text-anchor="middle" font-family="'Inter', sans-serif" font-size="7.5" font-weight="bold" fill="#475569" letter-spacing="0.5">
          AI STRATEGY
        </text>
      </g>

      <!-- Arrow 2 -->
      <text x="155" y="16" font-family="'Inter', sans-serif" font-size="12" fill="#B8860B" font-weight="bold">&gt;</text>

      <!-- Item 3: Automated Code -->
      <g transform="translate(180, 0)">
        <text x="20" y="16" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="bold" fill="#B8860B">&lt;/&gt;</text>
        <text x="20" y="32" text-anchor="middle" font-family="'Inter', sans-serif" font-size="7.5" font-weight="bold" fill="#475569" letter-spacing="0.5">
          AUTOMATED CODE
        </text>
      </g>

      <!-- Arrow 3 -->
      <text x="245" y="16" font-family="'Inter', sans-serif" font-size="12" fill="#B8860B" font-weight="bold">&gt;</text>

      <!-- Item 4: Trading Bot -->
      <g transform="translate(270, 0)">
        <rect x="11" y="4" width="18" height="15" rx="3" fill="none" stroke="#B8860B" stroke-width="1.5" />
        <circle cx="16" cy="10" r="1.5" fill="#B8860B" />
        <circle cx="24" cy="10" r="1.5" fill="#B8860B" />
        <line x1="16" y1="15" x2="24" y2="15" stroke="#B8860B" stroke-width="1.2" />
        <text x="20" y="32" text-anchor="middle" font-family="'Inter', sans-serif" font-size="7.5" font-weight="bold" fill="#475569" letter-spacing="0.5">
          TRADING BOT
        </text>
      </g>
    </g>

    <!-- ================= BOTTOM AUTHOR FOOTER ================= -->
    <g transform="translate(330, 675)" text-anchor="middle">
      <line x1="-120" y1="-6" x2="-55" y2="-6" stroke="url(#goldFoil)" stroke-width="1.5" />
      <text x="0" y="0" font-family="'Cinzel', 'Playfair Display', serif" font-size="20" font-weight="bold" fill="url(#goldText)" letter-spacing="5">
        M DINGA
      </text>
      <line x1="55" y1="-6" x2="120" y2="-6" stroke="url(#goldFoil)" stroke-width="1.5" />
    </g>
  </g>
</svg>
